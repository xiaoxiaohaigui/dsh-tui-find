# dsh-tui-find bundle patch: mount the plugin row into the profile
# composition tree.
#
# `dsh plugin --profile <name> add dsh-tui-find` pnpm-installs this package
# into the profile and appends it to dsh.profile.bundles (this package ships
# ./cordis.patch.yml for that flow). Manual mounting: insert the row below
# into $DSH_HOME/profiles/dsh-tui/cordis.patch.yml.
- insert:
    - id: dsh-tui-find
      name: 'dsh-tui-find'
      # Optional row config (all keys optional; see README):
      # defaultScope: 'repo' | 'all'   — initial search scope (default repo)
      # defaultTime: 'all' | '7d' | '30d' — initial time window (default all)
      # caseSensitive: boolean         — v0.1 default is case-insensitive
      # indexTools: boolean            — index tool-call summaries (default true)
      # indexThinking: boolean         — index thinking text (default false)
      # sessionRoot: string            — manual session-root override
      # maxMessageChars: number        — per-message index character budget
      # lang: 'auto' | 'zh' | 'en'     — UI language (auto follows the host)
      # shortcut: string               — global entry combo, ctrl/alt required
      #                                  ('off' disables; default 'ctrl+alt+f')
