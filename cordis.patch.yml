# dsh-tui-find bundle patch: mount the plugin row into the profile
# composition tree.
#
# `dsh plugin --profile <name> add dsh-tui-find` pnpm-installs this package
# into the profile and appends it to dsh.profile.bundles (this package ships
# ./cordis.patch.yml for that flow). Manual mounting: insert the row below
# into $DSH_HOME/profiles/dsh-tui/cordis.patch.yml.
- insert:
    - id: dsh-tui-find
      name: 'dsh-tui-find'
      # Optional row config — every key is optional. This list is the complete
      # one (defaults in parentheses); the README carries the same table with
      # the in-scene behaviour spelled out.
      # defaultScope: 'repo' | 'all'   — initial search scope (repo)
      # defaultTime: 'all' | '7d' | '30d' — initial time window (all)
      # layout: 'split' | 'classic'    — scene layout (split; >= 100 columns)
      # panel: boolean                 — sidebar search panel, needs dsh-TUI
      #                                  0.13.0+ (true; false = never register)
      # caseSensitive: boolean         — case-sensitive matching (false)
      # regex: boolean                 — start in regex mode (false)
      # pinyin: boolean                — pinyin matching (true)
      # titleOnly: boolean             — match session titles only (false)
      # showSubagentSessions: boolean  — also list sub-agent runs (false)
      # indexTools: boolean            — index tool-call summaries (false)
      # indexThinking: boolean         — index thinking text (false)
      # sessionRoot: string            — manual session-root override (auto)
      # maxMessageChars: number        — per-message index character budget
      # warmup: boolean                — background warm-up index (true)
      # lang: 'auto' | 'zh' | 'en'     — UI language (auto follows the host)
      # shortcut: string               — global entry combo, ctrl/alt required
      #                                  ('off' disables; default 'alt+f')
